services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Deliberately not published to the host. Only the api service needs it,
    # and it reaches Postgres over the compose network. To inspect it locally:
    #   docker compose exec postgres psql -U rag -d rag

  api:
    build: ./backend
    env_file: .env
    environment:
      # POSTGRES_USER / _PASSWORD / _DB reach the container through env_file,
      # so the credential lives in exactly one place: .env. Only the hostname
      # is compose-specific. The URL is assembled in app/db/url.py with proper
      # escaping rather than string-formatted here.
      POSTGRES_HOST: postgres
      UPLOAD_DIR: /data/uploads
      CHROMA_DIR: /data/chroma
    volumes:
      - rag-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres-data:
  rag-data:
