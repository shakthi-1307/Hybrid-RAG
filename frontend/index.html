<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔒 Offline RAG System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Header -->
      <header class="header">
        <h1>🔒 Offline RAG Assistant</h1>
        <p class="subtitle">100% Local • No API Keys • Privacy First</p>
      </header>

      <!-- Main Content -->
      <div class="main-content">
        <!-- Sidebar: Upload Section -->
        <aside class="sidebar">
          <div class="sidebar-section">
            <h3>📁 Knowledge Base</h3>

            <div class="upload-box">
              <input type="file" id="fileInput" accept=".pdf" />
              <button id="uploadBtn" class="btn-primary">Upload PDF</button>
            </div>

            <div id="uploadStatus" class="status-message"></div>

            <div class="stats-box">
              <h4>Database Stats</h4>
              <p>Documents: <span id="docCount">0</span></p>
              <button id="refreshStats" class="btn-secondary">Refresh</button>
            </div>
          </div>
        </aside>

        <!-- Chat Interface -->
        <main class="chat-container">
          <!-- Chat History -->
          <div id="chatHistory" class="chat-history">
            <div class="message bot">
              <div class="message-content">
                👋 Hello! Upload a PDF document and ask me anything about it.
              </div>
            </div>
          </div>

          <!-- Input Area -->
          <div class="input-area">
            <input
              type="text"
              id="userInput"
              placeholder="Ask a question about your documents..."
              autocomplete="off"
            />
            <button id="sendBtn" class="btn-primary">Send</button>
          </div>
        </main>
      </div>

      <!-- Sources Panel (Hidden by default) -->
      <div id="sourcesPanel" class="sources-panel hidden">
        <h3>📚 Sources Used</h3>
        <div id="sourcesList"></div>
        <button id="closeSources" class="btn-secondary">Close</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
