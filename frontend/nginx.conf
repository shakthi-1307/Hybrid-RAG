server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Must be >= MAX_UPLOAD_BYTES in backend/app/config.py. nginx defaults to
    # 1 MB and would reject larger uploads before they ever reach the API.
    client_max_body_size 50m;

    # Proxying the API under the same origin as the UI removes CORS entirely
    # and makes the session cookie first-party.
    location /api/ {
        # Resolve through Docker's embedded DNS at request time rather than at
        # startup, so nginx survives the api container restarting.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ingestion and generation are both slower than nginx's 60s default.
        proxy_read_timeout 180s;

        # Server-Sent Events. nginx buffers proxied responses by default,
        # which holds every token until the answer is complete and defeats
        # streaming entirely. The API also sends X-Accel-Buffering: no on the
        # streaming response; this is the belt to that braces, and covers the
        # case where a future endpoint streams without setting the header.
        proxy_buffering off;
        proxy_cache off;
        # SSE is HTTP/1.1 with a persistent connection. nginx proxies as 1.0
        # by default, which closes the connection after the first chunk.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
