server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Must be >= MAX_UPLOAD_BYTES in backend/app/config.py. nginx defaults to
    # 1 MB and would reject larger uploads before they ever reach the API.
    client_max_body_size 50m;

    # Proxying the API under the same origin as the UI removes CORS entirely
    # and makes the session cookie first-party.
    location /api/ {
        # Resolve through Docker's embedded DNS at request time rather than at
        # startup, so nginx survives the api container restarting.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ingestion and generation are both slower than nginx's 60s default.
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
